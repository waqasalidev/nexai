<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Primary Futuristic Gradient -->
    <linearGradient id="nexai-grad-1" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="nexai-grad-2" x1="120" y1="400" x2="400" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="nexai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#nexai-grad-1)" fill-opacity="0.08" stroke="url(#nexai-grad-1)" stroke-width="6" stroke-opacity="0.25" />

  <!-- Left Chamfered N Pillar -->
  <path d="M 124 388 V 164 L 212 116 V 340 Z" fill="url(#nexai-grad-1)" />

  <!-- Diagonal Neural Bridge -->
  <path d="M 196 156 L 316 356 V 212 L 236 124 Z" fill="url(#nexai-grad-2)" />

  <!-- Right Chamfered N Pillar -->
  <path d="M 300 124 V 348 L 388 396 V 172 Z" fill="url(#nexai-grad-1)" />

  <!-- Quantum AI Core Node -->
  <circle cx="256" cy="256" r="32" fill="#38bdf8" filter="url(#nexai-glow)" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
  
  <!-- Subtle Neural Connector Nodes -->
  <circle cx="168" cy="140" r="8" fill="#a855f7" />
  <circle cx="344" cy="372" r="8" fill="#38bdf8" />
</svg>
